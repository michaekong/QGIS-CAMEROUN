# ==========================================
# CONFIGURATION QGIS CAMEROON
# ==========================================

baseURL = '/'
languageCode = 'en-us'
title = 'QGIS Cameroon'
theme = 'qgis-website-theme'

[pagination]
  paginate = 50

pygmentsUseClasses = true
pygmentsCodefences = true

staticDir = ['static']
enableRobotsTXT = false

[taxonomies]
  category = 'categories'
  series = 'series'
  tag = 'tags'
  submenu = 'submenus'

[params]
  minHugoVersion = "0.139.0"
  
  # --- SIGNATURE COULEURS QGIS CAMEROUN ---
  # Rouge principal (Signature Cameroun)
  primary1 = "#C62828"       
  primary1-invert = "#ffffff"
  
  # Vert QGIS Officiel (Secondaire)
  primary2 = "#589632"       
  primary2-invert = "#ffffff"
  
  # Couleurs d'accentuation
  primary3 = "#2c3e50"       # Bleu nuit professionnel
  primary3-invert = "#ffffff"
  primary4 = "#FDD835"       # Jaune soleil (drapeau CM)
  primary4-invert = "#000000"
  primary5 = "#E53935"       # Rouge clair
  primary5-invert = "#ffffff"
  primary6 = "#8E0000"       # Rouge foncé
  primary6-invert = "#ffffff"
  
  links = "#C62828"
  
  complementary1 = "#589632"
  complementary2 = "#C62828"
  complementary3 = "#FDD835"
  complementary4 = "#589632"
  complementary5 = "#a7cecb"
  complementary6 = "#589632"
  complementary7 = "#93B022"
  complementary8 = "#385C6B"
  
  light1 = "#fbfbfb"
  light2 = "#eeeeee"
  light3 = "#E7E7E7"
  dark1 = "#808080"
  dark2 = "#000"
  
  text-primary1 = "#002033"
  text-primary2 = "#4D6370"
  
  # Bulma specific colours
  black = "#000"
  white = "#ffffff"
  grey-dark = "#444444"
  grey-darker = "#363636"
  grey-light = "#d4d4d4"
  
  # Mapping Bulma colors to QGIS Cameroon brand
  primary = "#C62828"        # Rouge signature
  danger = "#8E0000"         # Rouge foncé
  info = "#589632"           # Vert QGIS
  success = "#589632"        # Vert QGIS
  warning = "#FDD835"        # Jaune
  link = "#C62828"           # Rouge signature
  
  heading-font = "'Twemoji Country Flags', 'Trueno', sans-serif"
  text-font = "'Twemoji Country Flags', 'Trueno', sans-serif"
  fancy-font = "'Sevillana', cursive"

  ## GitHub Repo Links (Updated for QGIS Cameroon)
  githubRepo = "https://github.com/michaekong/QGIS-CAMEROUN/"
  githubSubdir = "content"
  githubBranch = "master"
  githubUrl = "https://github.com/michaekong/QGIS-CAMEROUN/"
  githubIssueUrl = "https://github.com/michaekong/QGIS-CAMEROUN/issues/new/choose"
  githubEditUrl = "https://github.com/michaekong/QGIS-CAMEROUN/edit/master"
  
  corner-radius = "0px"

  ## Navigation Web Component
  uniNavHeaderUrl = 'https://qgis.github.io/qgis-uni-navigation/index.js'
  # Force l'affichage de "QGIS Cameroon" dans la barre globale
  uniNavHeaderLocationPrefix = "cameroon" 

  newsfeed ='https://feed.qgis.org/?lang=en&json=1'
  cookiesstate = false

  matomoURL = "//matomo.qgis.org/"
  matomoSiteId = '7'
  commitFile = "config/commit.toml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
      codeFences = true
      guessSyntax = true
      hl_Lines = ""
      lineNoStart = 1
      lineNos = false
      lineNumbersInTable = false
      tabWidth = 4
      noClasses = false
      style = "monokai"
  [markup.tableOfContents]
      endLevel = 3
      ordered = false
      startLevel = 2

sectionPagesMenu = 'main'

